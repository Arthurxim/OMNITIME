<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Étudiant Avancé</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Configuration PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Planning Étudiant">
    <style>
        .slot-height { height: 40px; } /* 40px par bloc de 30 min (soit 80px par heure) */
        /* Motifs personnalisés pour les types de cours */
        .pattern-partiel { background: repeating-linear-gradient(45deg, #ef4444, #ef4444 10px, #dc2626 10px, #dc2626 20px); }
        .pattern-cm { background-color: #3b82f6; }
        .pattern-td { background-color: #10b981; }
        .pattern-tp { background-color: #f59e0b; }
        .pattern-vacances { background: repeating-linear-gradient(-45deg, #e0e7ff, #e0e7ff 10px, #c7d2fe 10px, #c7d2fe 20px); }
        .pattern-stage { background: repeating-linear-gradient(45deg, #fef3c7, #fef3c7 10px, #fde68a 10px, #fde68a 20px); }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col font-sans">

    <!-- En-tête de l'application -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-calendar-days text-2xl"></i>
            <h1 class="text-xl font-bold">Mon Planning Étudiant</h1>
        </div>
        
        <!-- Navigation par semaine (ancrée sur le lundi) -->
        <div class="flex items-center gap-2 bg-indigo-700 px-3 py-1.5 rounded-lg shadow-inner">
            <button onclick="changeWeek(-1)" class="p-1.5 hover:bg-indigo-800 rounded transition" title="Semaine précédente"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="currentWeekLabel" class="font-semibold text-sm px-2 min-w-[220px] text-center">Chargement...</span>
            <button onclick="changeWeek(1)" class="p-1.5 hover:bg-indigo-800 rounded transition" title="Semaine suivante"><i class="fa-solid fa-chevron-right"></i></button>
            <button onclick="goToCurrentWeek()" class="ml-2 bg-indigo-500 hover:bg-indigo-400 text-xs px-2.5 py-1 rounded transition font-medium">Aujourd'hui</button>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="requestNotificationPermission()" id="notifBtn" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-bell"></i> Activer Notifs
            </button>
            <button onclick="openEventModal()" class="bg-white text-indigo-600 hover:bg-slate-100 px-3 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Ajouter
            </button>
        </div>
    </header>

    <!-- Zone d'alerte In-App / Notifications -->
    <div id="alertBanner" class="hidden bg-amber-500 text-white px-4 py-2 text-sm text-center font-medium shadow-inner flex justify-center items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="alertText">Tâches ou partiels imminents détectés !</span>
    </div>

    <!-- Contenu principal : Planning & Tâches -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-4 gap-4">
        
        <!-- Grille du calendrier (Lundi-Vendredi, 8h-19h) -->
        <div class="flex-1 bg-white rounded-xl shadow flex flex-col overflow-hidden border border-slate-200">
            <!-- En-têtes des jours (Lundi au Vendredi) -->
            <div id="calendarHeader" class="grid grid-cols-6 bg-slate-50 border-b border-slate-200 text-center font-semibold text-xs sm:text-sm text-slate-700 sticky top-0 z-10">
                <div class="p-3 border-r border-slate-200 flex items-center justify-center text-slate-400"><i class="fa-solid fa-clock"></i></div>
                <div class="p-3 border-r border-slate-200 day-col-header" data-day-index="1">Lundi</div>
                <div class="p-3 border-r border-slate-200 day-col-header" data-day-index="2">Mardi</div>
                <div class="p-3 border-r border-slate-200 day-col-header" data-day-index="3">Mercredi</div>
                <div class="p-3 border-r border-slate-200 day-col-header" data-day-index="4">Jeudi</div>
                <div class="p-3 day-col-header" data-day-index="5">Vendredi</div>
            </div>

            <!-- Corps de la grille horaire (8h00 à 19h00) -->
            <div class="flex-1 overflow-y-auto relative grid grid-cols-6 divide-x divide-slate-100">
                <!-- Colonne des heures -->
                <div id="timeColumn" class="flex flex-col bg-slate-50/50 text-xs text-slate-500 font-medium select-none">
                    <!-- Généré dynamiquement par JS (8h à 19h, pas de 30 min) -->
                </div>
                <!-- Colonnes des 5 jours de la semaine -->
                <div class="relative day-column border-r border-slate-100" data-day="1"></div>
                <div class="relative day-column border-r border-slate-100" data-day="2"></div>
                <div class="relative day-column border-r border-slate-100" data-day="3"></div>
                <div class="relative day-column border-r border-slate-100" data-day="4"></div>
                <div class="relative day-column" data-day="5"></div>
            </div>
        </div>

        <!-- Panneau latétal : Gestion des Tâches & Tâches Post-Cours Automatiques -->
        <aside class="w-full lg:w-80 bg-white rounded-xl shadow flex flex-col overflow-hidden border border-slate-200">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-list-check text-indigo-600"></i> Tâches & Suivi</h2>
                <span id="taskCount" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </div>
            <div id="taskList" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Rempli dynamiquement -->
            </div>
            <div class="p-3 bg-slate-50 border-t border-slate-200">
                <button onclick="openTaskModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2 rounded-lg transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Ajouter une tâche
                </button>
            </div>
        </aside>
    </main>

    <!-- Modale d'ajout / édition d'événement -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 bg-indigo-600 text-white flex justify-between items-center">
                <h3 id="eventModalTitle" class="font-bold text-lg">Ajouter un événement</h3>
                <button onclick="closeEventModal()" class="text-white/80 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="eventId">
                <input type="hidden" id="eventSeriesId">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Titre / Matière</label>
                    <input type="text" id="eventTitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="ex: Topologie, Algèbre...">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Type</label>
                        <select id="eventType" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="CM">CM (Cours Magistral)</option>
                            <option value="TD">TD (Travaux Dirigés)</option>
                            <option value="TP">TP (Travaux Pratiques)</option>
                            <option value="Partiel">Partiel (Examen)</option>
                            <option value="Vacances">Vacances</option>
                            <option value="Stage">Stage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Jour</label>
                        <select id="eventDay" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="1">Lundi</option>
                            <option value="2">Mardi</option>
                            <option value="3">Mercredi</option>
                            <option value="4">Jeudi</option>
                            <option value="5">Vendredi</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Heure de début</label>
                        <input type="time" id="eventStart" min="08:00" max="19:00" step="1800" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value="08:00">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Heure de fin</label>
                        <input type="time" id="eventEnd" min="08:00" max="19:00" step="1800" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" value="10:00">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Date spécifique (ou début de période)</label>
                    <input type="date" id="eventDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Date de fin (Vacances / Stage)</label>
                    <input type="date" id="eventEndDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="eventRecurring" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                    <label for="eventRecurring" class="text-sm font-medium text-slate-700">Répéter chaque semaine (Récurrence)</label>
                </div>
            </div>

            <!-- Pied de modale avec boutons de suppression distincts -->
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                <div id="deleteButtonsContainer" class="flex gap-2 hidden">
                    <button onclick="deleteSingleEvent()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-semibold px-3 py-2 rounded-lg transition" title="Supprimer uniquement cette occurrence">Supprimer cet événement</button>
                    <button onclick="deleteSeriesEvent()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition" title="Supprimer toute la récurrence">Supprimer série</button>
                </div>
                <div class="flex gap-2 ml-auto">
                    <button onclick="closeEventModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-lg transition">Annuler</button>
                    <button onclick="saveEvent()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale d'ajout de tâche manuelle -->
    <div id="taskModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-indigo-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">Ajouter une tâche</h3>
                <button onclick="closeTaskModal()" class="text-white/80 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Intitulé de la tâche</label>
                    <input type="text" id="taskTitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="ex: Réviser le chapitre 3...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Date limite (Échéance)</label>
                    <input type="date" id="taskDueDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                <button onclick="closeTaskModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-lg transition">Annuler</button>
                <button onclick="saveTask()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- Logique JavaScript principale -->
    <script>
        // Enregistrement du Service Worker pour les PWA & Notifications Push
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker enregistré avec succès !', reg))
                    .catch((err) => console.log('Erreur d\'enregistrement du Service Worker', err));
            });
        }

        // --- Données initiales et chargement local ---
        let currentMonday = getMonday(new Date());
        
        let events = JSON.parse(localStorage.getItem('student_events')) || [
            { id: '1', seriesId: 's1', title: 'Topologie métrique', type: 'CM', day: 1, start: '08:00', end: '10:00', date: '2026-09-21', recurring: true },
            { id: '2', seriesId: 's2', title: 'Algèbre linéaire', type: 'TD', day: 2, start: '10:15', end: '12:15', date: '2026-09-22', recurring: true },
            { id: '3', seriesId: 's3', title: 'Probabilités', type: 'Partiel', day: 4, start: '14:00', end: '17:00', date: '2026-09-24', recurring: false }
        ];

        let tasks = JSON.parse(localStorage.getItem('student_tasks')) || [
            { id: 't1', title: 'Relire le cours de Topologie', dueDate: '2026-09-28', completed: false, autoGenerated: false }
        ];

        let exceptions = JSON.parse(localStorage.getItem('student_exceptions')) || {}; // { eventId_or_seriesId_date: 'deleted' }

        // Jours fériés fixes en France
        const frenchHolidays = ['01-01', '05-01', '05-08', '07-14', '08-15', '11-01', '11-11', '12-25'];

        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay(),
                diff = d.getDate() - day + (day == 0 ? -6 : 1);
            let monday = new Date(d.setDate(diff));
            monday.setHours(0, 0, 0, 0);
            return monday;
        }

        function formatDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        // --- Initialisation au chargement de la page ---
        window.addEventListener('DOMContentLoaded', () => {
            buildTimeColumn();
            updateCalendar();
            checkAndGenerateAutoTasks();
            renderTasks();
            checkAlerts();
        });

        // Construction de la grille horaire verticale (8h00 à 19h00, pas de 30 min, 40px par bloc)
        function buildTimeColumn() {
            const timeCol = document.getElementById('timeColumn');
            timeCol.innerHTML = '';
            for (let hour = 8; hour < 19; hour++) {
                for (let min of [0, 30]) {
                    const timeSlot = document.createElement('div');
                    timeSlot.className = 'slot-height border-b border-slate-200/60 px-2 text-right flex items-center justify-end text-[11px]';
                    const timeStr = `${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
                    timeSlot.textContent = (min === 0) ? timeStr : '';
                    timeCol.appendChild(timeSlot);
                }
            }
        }

        // Navigation hebdomadaire
        function changeWeek(direction) {
            currentMonday.setDate(currentMonday.getDate() + (direction * 7));
            updateCalendar();
        }

        function goToCurrentWeek() {
            currentMonday = getMonday(new Date());
            updateCalendar();
        }

        // Mise à jour de l'affichage du calendrier et des en-têtes de jours
        function updateCalendar() {
            const label = document.getElementById('currentWeekLabel');
            let sunday = new Date(currentMonday);
            sunday.setDate(sunday.getDate() + 4); // Vendredi
            label.textContent = `Semaine du ${currentMonday.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} au ${sunday.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}`;

            // Mettre à jour les en-têtes avec les dates exactes
            const headers = document.querySelectorAll('.day-col-header');
            headers.forEach((header, index) => {
                let dayDate = new Date(currentMonday);
                dayDate.setDate(currentMonday.getDate() + index);
                let dayNames = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
                let dateStr = dayDate.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
                
                // Vérifier si c'est un jour férié français
                let mmdd = `${(dayDate.getMonth()+1).toString().padStart(2, '0')}-${dayDate.getDate().toString().padStart(2, '0')}`;
                let isHoliday = frenchHolidays.includes(mmdd);

                header.innerHTML = `${dayNames[index]} <span class="block text-[11px] font-normal ${isHoliday ? 'text-rose-500 font-bold' : 'text-slate-400'}">${dateStr} ${isHoliday ? '(Férié)' : ''}</span>`;
            });

            renderEvents();
        }

        // Rendu des événements dans les colonnes correspondantes
        function renderEvents() {
            const columns = document.querySelectorAll('.day-column');
            columns.forEach(col => col.innerHTML = '');

            // Calculer les dates de la semaine courante
            let weekDays = [];
            for (let i = 0; i < 5; i++) {
                let d = new Date(currentMonday);
                d.setDate(currentMonday.getDate() + i);
                weekDays.push(formatDateKey(d));
            }

            events.forEach(ev => {
                // Déterminer les dates d'affichage selon récurrence ou date fixe
                let occurrences = [];
                if (ev.recurring) {
                    // Pour chaque jour de la semaine courante correspondant au jour de l'événement
                    let dayIndex = ev.day - 1; // 0 à 4
                    let targetDateStr = weekDays[dayIndex];
                    let exceptionKey = `${ev.id}_${targetDateStr}`;
                    let seriesExceptionKey = `${ev.seriesId}_${targetDateStr}`;
                    
                    if (!exceptions[exceptionKey] && !exceptions[seriesExceptionKey]) {
                        occurrences.push({ ...ev, activeDate: targetDateStr });
                    }
                } else {
                    if (weekDays.includes(ev.date)) {
                        let exceptionKey = `${ev.id}_${ev.date}`;
                        if (!exceptions[exceptionKey]) {
                            occurrences.push({ ...ev, activeDate: ev.date });
                        }
                    }
                }

                occurrences.forEach(occ => {
                    const col = document.querySelector(`.day-column[data-day="${occ.day}"]`);
                    if (!col) return;

                    // Calcul de la position verticale (40px par 30 min, départ à 8h00)
                    let [startH, startM] = occ.start.split(':').map(Number);
                    let [endH, endM] = occ.end.split(':').map(Number);
                    
                    let topMinutes = (startH - 8) * 60 + startM;
                    let durationMinutes = (endH * 60 + endM) - (startH * 60 + startM);
                    
                    let topPx = (topMinutes / 30) * 40;
                    let heightPx = (durationMinutes / 30) * 40;

                    const card = document.createElement('div');
                    card.className = `absolute inset-x-1 rounded-lg p-2 text-white shadow-sm cursor-pointer overflow-hidden transition hover:scale-[1.01] ${getPatternClass(occ.type)}`;
                    card.style.top = `${topPx}px`;
                    card.style.height = `${Math.max(heightPx, 35)}px`;
                    
                    card.innerHTML = `
                        <div class="text-[11px] font-bold uppercase tracking-wider opacity-90">${occ.type}</div>
                        <div class="text-xs font-bold truncate">${occ.title}</div>
                        <div class="text-[10px] opacity-80">${occ.start} - ${occ.end}</div>
                    `;

                    card.onclick = () => openEditEventModal(occ);
                    col.appendChild(card);
                });
            });
        }

        function getPatternClass(type) {
            switch(type) {
                case 'Partiel': return 'pattern-partiel';
                case 'CM': return 'pattern-cm';
                case 'TD': return 'pattern-td';
                case 'TP': return 'pattern-tp';
                case 'Vacances': return 'pattern-vacances text-slate-800 border border-indigo-200';
                case 'Stage': return 'pattern-stage text-slate-800 border border-amber-200';
                default: return 'bg-indigo-600';
            }
        }

        // --- Logique intelligente de génération automatique des tâches post-cours ---
        function checkAndGenerateAutoTasks() {
            const now = new Date();
            const todayStr = formatDateKey(now);
            const currentTimeStr = now.toTimeString().slice(0, 5);

            events.forEach(ev => {
                if (ev.type === 'Vacances' || ev.type === 'Stage') return;

                // Trouver les dates récentes où ce cours a eu lieu
                let evDateStr = ev.date;
                if (ev.recurring) {
                    // Vérifier sur les 14 derniers jours si le jour correspond
                    for (let i = 0; i < 14; i++) {
                        let d = new Date();
                        d.setDate(d.getDate() - i);
                        if (d.getDay() === ev.day) {
                            evDateStr = formatDateKey(d);
                            break;
                        }
                    }
                }

                // Si la date du cours est passée ou que c'est aujourd'hui après l'heure de fin
                if (evDateStr < todayStr || (evDateStr === todayStr && currentTimeStr >= ev.end)) {
                    // Vérifier si une tâche automatique existe déjà pour cette session exacte
                    let taskTitle = `Réviser / Suivi post-cours : ${ev.title}`;
                    let existing = tasks.find(t => t.autoGenerated && t.courseId === ev.id && t.sessionDate === evDateStr);

                    if (!existing) {
                        // Trouver la date du prochain cours pour l'échéance automatique
                        let nextCourseDate = calculateNextCourseDate(ev);

                        tasks.push({
                            id: 'auto_' + Date.now() + Math.random(),
                            courseId: ev.id,
                            sessionDate: evDateStr,
                            title: taskTitle,
                            dueDate: nextCourseDate,
                            completed: false,
                            autoGenerated: true
                        });
                        saveTasks();
                    }
                }
            });
        }

        function calculateNextCourseDate(ev) {
            let d = new Date();
            for (let i = 1; i <= 14; i++) {
                d.setDate(d.getDate() + 1);
                if (d.getDay() === ev.day) {
                    return formatDateKey(d);
                }
            }
            let fallback = new Date();
            fallback.setDate(fallback.getDate() + 3);
            return formatDateKey(fallback);
        }

        // Rendu de la liste des tâches
        function renderTasks() {
            const list = document.getElementById('taskList');
            const count = document.getElementById('taskCount');
            list.innerHTML = '';
            count.textContent = tasks.length;

            if (tasks.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">Aucune tâche en cours. Bon travail !</div>`;
                return;
            }

            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border flex flex-col gap-1 transition ${task.completed ? 'bg-slate-50 border-slate-200 opacity-60 line-through' : 'bg-white border-slate-200 shadow-sm'}`;
                
                item.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')" class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4 cursor-pointer">
                            <span class="text-xs font-semibold text-slate-800">${task.title}</span>
                        </div>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-500 pl-6">
                        <span>Échéance : ${task.dueDate}</span>
                        ${task.autoGenerated ? '<span class="bg-indigo-50 text-indigo-600 font-bold px-1.5 py-0.5 rounded">Auto-cours</span>' : ''}
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleTask(id) {
            let t = tasks.find(x => x.id === id);
            if (t) {
                t.completed = !t.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(x => x.id !== id);
            saveTasks();
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('student_tasks', JSON.stringify(tasks));
        }

        // --- Gestion des modales et formulaires d'événements ---
        function openEventModal() {
            document.getElementById('eventModalTitle').textContent = "Ajouter un événement";
            document.getElementById('eventId').value = '';
            document.getElementById('eventSeriesId').value = 'series_' + Date.now();
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventType').value = 'CM';
            document.getElementById('eventDay').value = '1';
            document.getElementById('eventStart').value = '08:00';
            document.getElementById('eventEnd').value = '10:00';
            document.getElementById('eventDate').value = formatDateKey(new Date());
            document.getElementById('eventEndDate').value = '';
            document.getElementById('eventRecurring').checked = false;
            document.getElementById('deleteButtonsContainer').classList.add('hidden');
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function openEditEventModal(occ) {
            document.getElementById('eventModalTitle').textContent = "Modifier / Gérer l'événement";
            document.getElementById('eventId').value = occ.id;
            document.getElementById('eventSeriesId').value = occ.seriesId || ('series_' + occ.id);
            document.getElementById('eventTitle').value = occ.title;
            document.getElementById('eventType').value = occ.type;
            document.getElementById('eventDay').value = occ.day;
            document.getElementById('eventStart').value = occ.start;
            document.getElementById('eventEnd').value = occ.end;
            document.getElementById('eventDate').value = occ.date || occ.activeDate;
            document.getElementById('eventEndDate').value = occ.endDate || '';
            document.getElementById('eventRecurring').checked = occ.recurring || false;
            
            // Afficher les boutons de suppression distincts si c'est un événement existant
            document.getElementById('deleteButtonsContainer').classList.remove('hidden');
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        function saveEvent() {
            const id = document.getElementById('eventId').value;
            const seriesId = document.getElementById('eventSeriesId').value;
            const title = document.getElementById('eventTitle').value.trim();
            const type = document.getElementById('eventType').value;
            const day = parseInt(document.getElementById('eventDay').value);
            const start = document.getElementById('eventStart').value;
            const end = document.getElementById('eventEnd').value;
            const date = document.getElementById('eventDate').value;
            const endDate = document.getElementById('eventEndDate').value;
            const recurring = document.getElementById('eventRecurring').checked;

            if (!title) {
                alert("Veuillez entrer un titre ou une matière.");
                return;
            }

            if (id) {
                // Modification
                let index = events.findIndex(e => e.id === id);
                if (index !== -1) {
                    events[index] = { id, seriesId, title, type, day, start, end, date, endDate, recurring };
                }
            } else {
                // Création
                let newEv = {
                    id: 'ev_' + Date.now(),
                    seriesId: seriesId,
                    title, type, day, start, end, date, endDate, recurring
                };
                events.push(newEv);
            }

            localStorage.setItem('student_events', JSON.stringify(events));
            closeEventModal();
            updateCalendar();
        }

        // Boutons de suppression distincts
        function deleteSingleEvent() {
            const id = document.getElementById('eventId').value;
            const date = document.getElementById('eventDate').value;
            if (id && date) {
                exceptions[`${id}_${date}`] = 'deleted';
                localStorage.setItem('student_exceptions', JSON.stringify(exceptions));
                closeEventModal();
                updateCalendar();
            }
        }

        function deleteSeriesEvent() {
            const id = document.getElementById('eventId').value;
            let ev = events.find(e => e.id === id);
            if (ev) {
                let targetSeriesId = ev.seriesId || id;
                events = events.filter(e => e.id !== targetSeriesId && e.seriesId !== targetSeriesId);
                localStorage.setItem('student_events', JSON.stringify(events));
                closeEventModal();
                updateCalendar();
            }
        }

        // Modale Tâche manuelle
        function openTaskModal() {
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDueDate').value = formatDateKey(new Date());
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function saveTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const dueDate = document.getElementById('taskDueDate').value;

            if (!title) {
                alert("Veuillez entrer un intitulé.");
                return;
            }

            tasks.push({
                id: 'task_' + Date.now(),
                title,
                dueDate,
                completed: false,
                autoGenerated: false
            });

            saveTasks();
            closeTaskModal();
            renderTasks();
        }

        // Alertes In-App et Notifications Push système
        function checkAlerts() {
            const alertBanner = document.getElementById('alertBanner');
            const alertText = document.getElementById('alertText');
            let todayStr = formatDateKey(new Date());

            let urgentPartials = events.filter(e => e.type === 'Partiel' && e.date >= todayStr);
            if (urgentPartials.length > 0) {
                alertBanner.classList.remove('hidden');
                alertText.textContent = `Attention : ${urgentPartials.length} partiel(s) programmé(s) prochainement !`;
            } else {
                alertBanner.classList.add('hidden');
            }
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                alert("Ce navigateur ne supporte pas les notifications.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert("Notifications activées avec succès !");
                    new Notification("Planning Étudiant", { body: "Les notifications sont désormais actives." });
                } else {
                    alert("Permission refusée pour les notifications.");
                }
            });
        }
    </script>
</body>
</html>
